name: Reanzly v2 Secure CI-CD Pipeline & DevSecOps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  devsecops-ci-audit:
    name: DevSecOps CI & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          cd mini-services/chat-service && bun install

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Run Linter (ESLint)
        run: bun run lint

      - name: Supply Chain Dependency Audit
        run: bun pm audit || true

      - name: Production Build Test
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:ci-test@localhost:5432/test"
          NEXTAUTH_SECRET: "ci-cd-test-secret-value-32-characters-minimum"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image for Security Scan
        run: |
          docker build -t reanzly:security-scan .

      - name: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'reanzly:security-scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  cd-deploy-enterprise-live:
    name: Continuous Deployment (CD)
    needs: devsecops-ci-audit
    # Skips once DEPLOY_MODE is switched to the self-hosted-runner path below -
    # until then this SSH path runs exactly as it always has.
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.DEPLOY_MODE != 'self-hosted-runner'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The deploy server has been unreachable before (SSH connect timeout),
      # which previously hard-failed this job on every push even though the
      # code itself was fine. This step probes host:port with retries first
      # so an infra outage shows as a clear warning instead of a red X, and
      # doesn't leave the pipeline stuck "crashing" on every commit.
      - name: Check Deploy Host Reachability
        id: reachability
        run: |
          HOST="${{ secrets.SSH_HOST || '151.106.96.77' }}"
          PORT="${{ secrets.SSH_PORT || 65002 }}"
          echo "Probing $HOST:$PORT ..."
          ok=false
          for i in 1 2 3; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
              ok=true
              break
            fi
            echo "Attempt $i/3 failed, retrying in 5s..."
            sleep 5
          done
          echo "reachable=$ok" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Execute Live Secure SSH Deployment
        id: deploy
        if: steps.reachability.outputs.reachable == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '151.106.96.77' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script: |
            set -e
            APP_DIR="/opt/reanzly"
            mkdir -p $APP_DIR
            cd $APP_DIR

            if [ -d ".git" ]; then
              git fetch origin main && git reset --hard origin/main
            else
              echo "Deploying via SSH payload..."
            fi

            # Environment configuration
            cat << 'EOF' > .env
            NODE_ENV=production
            PORT=3000
            CHAT_SERVICE_PORT=3003
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DIRECT_URL=${{ secrets.DIRECT_URL }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL || 'https://reanzly.com' }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            STORAGE_DRIVER=local
            STORAGE_LOCAL_PATH=/app/storage
            EOF

            # Automated encrypted backup & enterprise deployment
            chmod +x scripts/deploy-prod.sh scripts/backup-encrypt.sh scripts/security-audit.sh
            ./scripts/deploy-prod.sh

      # Always runs, never fails the job - so a dead deploy target reads as
      # a visible warning in the summary/annotations rather than repeatedly
      # blocking the pipeline with no way to fix it from this repo alone.
      - name: Deployment Summary
        if: always()
        run: |
          HOST="${{ steps.reachability.outputs.host }}"
          PORT="${{ steps.reachability.outputs.port }}"
          if [ "${{ steps.reachability.outputs.reachable }}" != "true" ]; then
            echo "### :warning: Deploy skipped - host unreachable" >> "$GITHUB_STEP_SUMMARY"
            echo "Could not reach \`$HOST:$PORT\` after 3 attempts. Code is pushed to \`main\` but was **not** deployed to the live server." >> "$GITHUB_STEP_SUMMARY"
            echo "Check: is the server running, is \`SSH_HOST\`/\`SSH_PORT\` correct in repo secrets, and is the port open to GitHub Actions' IP ranges." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Deploy skipped::Host $HOST:$PORT unreachable - see job summary for details."
          elif [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "### :warning: Deploy step failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Host \`$HOST:$PORT\` was reachable but the deploy script did not complete - check the \"Execute Live Secure SSH Deployment\" step log above." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Deploy failed::SSH deploy script failed - see job summary for details."
          else
            echo "### :white_check_mark: Deployed successfully" >> "$GITHUB_STEP_SUMMARY"
          fi

  cd-deploy-self-hosted-runner:
    name: Continuous Deployment (CD) - Self-Hosted Runner
    needs: devsecops-ci-audit
    # Inactive (and won't even queue) until a self-hosted runner is registered
    # on the deploy server AND the repo variable DEPLOY_MODE is set to
    # "self-hosted-runner" (Settings > Secrets and variables > Actions >
    # Variables). See docs/deploy-self-hosted-runner.md for the one-time
    # server setup this depends on.
    #
    # Why this exists: the SSH-based job above needs GitHub's runner IPs to
    # reach the deploy server's SSH port inbound, which has been unreachable
    # in practice. A self-hosted runner flips the direction - the runner
    # (installed on the server itself) opens an outbound connection to
    # GitHub, so no inbound port needs to be open at all.
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.DEPLOY_MODE == 'self-hosted-runner'
    runs-on: [self-hosted]
    # Fails fast instead of queuing for hours if the runner service is
    # offline - a clear red X within minutes beats a silently stuck job.
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync code to app directory
        run: |
          set -e
          APP_DIR="/opt/reanzly"
          mkdir -p "$APP_DIR"
          # Mirror the checked-out tree into the real app directory, leaving
          # the live DB, its WAL/SHM files, and .env untouched.
          rsync -a --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "db/custom.db" \
            --exclude "db/custom.db-wal" \
            --exclude "db/custom.db-shm" \
            --exclude ".env" \
            ./ "$APP_DIR/"

      - name: Write production environment file
        run: |
          cat << 'EOF' > /opt/reanzly/.env
          NODE_ENV=production
          PORT=3000
          CHAT_SERVICE_PORT=3003
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL || 'https://reanzly.com' }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          STORAGE_DRIVER=local
          STORAGE_LOCAL_PATH=/app/storage
          EOF

      - name: Run production deploy script
        working-directory: /opt/reanzly
        run: |
          chmod +x scripts/deploy-prod.sh scripts/backup-encrypt.sh scripts/security-audit.sh
          ./scripts/deploy-prod.sh

      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### :white_check_mark: Deployed successfully via self-hosted runner" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :warning: Self-hosted deploy failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the step logs above. If the job never started, the runner service on the deploy server is likely offline." >> "$GITHUB_STEP_SUMMARY"
          fi
