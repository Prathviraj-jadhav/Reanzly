# Reanzly monorepo CI — quality gates without production deploy.
# Does not require Vercel/Render/SSH secrets.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck Lint Test Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          # prisma generate does not need a live database
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://postgres:ci@127.0.0.1:5432/ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npm run build:web
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://postgres:ci@127.0.0.1:5432/ci
          NEXTAUTH_SECRET: ci-cd-test-secret-value-32-characters-minimum
          NEXTAUTH_URL: http://localhost:3000

      - name: Build API
        run: npm run build:api

  # Design-only job placeholder: enable when non-prod DB + Playwright secrets exist.
  # Do NOT point this at production DATABASE_URL.
  routing-critical-e2e:
    name: Routing critical E2E (manual design)
    if: false
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run critical routing suite
        working-directory: apps/web
        run: npx playwright test e2e/routing-b0r8p.spec.ts --project=chromium
        env:
          # Must be a disposable local/staging database — never production
          E2E_TEST_MODE: "1"
          NEXT_PUBLIC_ROUTING_MIGRATION: "1"
