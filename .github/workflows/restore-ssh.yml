name: Restore SSH and Debug VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  debug-vps:
    runs-on: self-hosted
    steps:
      - name: Debug Environment
        run: |
          echo "=== Runner User ==="
          whoami
          id
          pwd

      - name: Restore SSH Key
        run: |
          KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKQWjw4yZwvvoXLQdNYcrzEsEarubVk2bPDZDerEiSFt deploy@reanzly.com"
          echo "Adding key to current user..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if ! grep -q "$KEY" ~/.ssh/authorized_keys 2>/dev/null; then
            echo "$KEY" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "Key added successfully to ~/.ssh/authorized_keys."
          else
            echo "Key already exists in ~/.ssh/authorized_keys."
          fi

      - name: Restore Deploy User SSH Key
        run: |
          KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKQWjw4yZwvvoXLQdNYcrzEsEarubVk2bPDZDerEiSFt deploy@reanzly.com"
          if [ -d "/home/deploy" ]; then
            echo "Adding key to deploy user..."
            sudo mkdir -p /home/deploy/.ssh
            sudo chmod 700 /home/deploy/.ssh
            sudo bash -c "echo '$KEY' >> /home/deploy/.ssh/authorized_keys"
            sudo chmod 600 /home/deploy/.ssh/authorized_keys
            sudo chown -R deploy:deploy /home/deploy/.ssh
            echo "Key added successfully for deploy user."
          else
            echo "/home/deploy directory not found."
          fi

      - name: Debug Docker and Ports
        run: |
          echo "=== Docker Status ==="
          sudo docker ps || docker ps || true
          echo "=== Network Connections on 80/443 ==="
          sudo netstat -tulpn | grep -E ':80|:443' || sudo ss -tulpn | grep -E ':80|:443' || true
