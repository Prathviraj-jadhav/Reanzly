name: Restore SSH and Debug VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  debug-vps:
    runs-on: self-hosted
    steps:
      - name: Run VPS Diagnostics
        run: |
          exec > vps-debug.txt 2>&1
          echo "=== Timestamp ==="
          date
          echo "=== Runner User ==="
          whoami
          id
          pwd
          
          echo "=== SSH Key Restore ==="
          KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKQWjw4yZwvvoXLQdNYcrzEsEarubVk2bPDZDerEiSFt deploy@reanzly.com"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if ! grep -q "$KEY" ~/.ssh/authorized_keys 2>/dev/null; then
            echo "$KEY" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "Key added to ~/.ssh/authorized_keys"
          else
            echo "Key already in ~/.ssh/authorized_keys"
          fi

          if [ -d "/home/deploy" ]; then
            echo "Adding key to /home/deploy/.ssh/authorized_keys"
            sudo mkdir -p /home/deploy/.ssh
            sudo chmod 700 /home/deploy/.ssh
            sudo bash -c "echo '$KEY' >> /home/deploy/.ssh/authorized_keys"
            sudo chmod 600 /home/deploy/.ssh/authorized_keys
            sudo chown -R deploy:deploy /home/deploy/.ssh
          fi

          echo "=== Docker Status ==="
          sudo docker ps || docker ps || true
          
          echo "=== Port 80 / 443 Listeners ==="
          sudo netstat -tulpn | grep -E ':80|:443' || sudo ss -tulpn | grep -E ':80|:443' || true
          
          echo "=== UFW Firewall Status ==="
          sudo ufw status || true
          
          echo "=== Fail2ban Status ==="
          sudo fail2ban-client status || true

      - name: Commit and push debug logs
        run: |
          git config --global user.name "Reanzly Deployer"
          git config --global user.email "deploy@reanzly.com"
          git add vps-debug.txt
          git commit -m "debug: VPS diagnostics [skip ci]" || true
          git push origin main || true
