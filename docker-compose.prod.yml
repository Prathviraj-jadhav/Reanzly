# =============================================================================
# Reanzly v2 — Enterprise Hardened Docker Compose Production Setup
# Cyber Defense & Infrastructure Hardening Configuration
# =============================================================================
version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    container_name: reanzly-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/caddy
      - /config
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - reanzly-prod-network
    depends_on:
      reanzly-app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    sysctls:
      net.ipv4.tcp_syncookies: 1
      net.ipv4.conf.all.rp_filter: 1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  reanzly-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reanzly:prod
    container_name: reanzly-app
    restart: always
    expose:
      - "3000"
      - "3003"
    environment:
      NODE_ENV: production
      PORT: "3000"
      CHAT_SERVICE_PORT: "3003"
      DATABASE_URL: ${DATABASE_URL:-file:/app/db/custom.db}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://reanzly.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    volumes:
      - reanzly-prod-db:/app/db
      - reanzly-prod-storage:/app/storage
    networks:
      - reanzly-prod-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  reanzly-prod-network:
    driver: bridge

volumes:
  reanzly-prod-db:
  reanzly-prod-storage:
  caddy_data:
